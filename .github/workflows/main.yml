
name: Build Tahakkum APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android project
        shell: mv build.gradle.kts app/build.gradle.ktssed -i '/buildFeatures { compose = true }/i\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = "17" }' app/build.gradle.kts
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/tahakkum
          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/example/tahakkum/MainActivity.kt
          fi
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f build.gradle.kts ]; then
            mv build.gradle.kts app/build.gradle.kts
          fi
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tahakkum-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

